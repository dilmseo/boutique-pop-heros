name: Blog du jour
on:
  schedule:
    - cron: '7 5 * * *'   # 6 h 07 à Paris l'hiver (7 h 07 l'été)
  workflow_dispatch:
permissions:
  contents: write
concurrency: blog-du-jour
jobs:
  article:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - id: ecrire
        run: node scripts/blog-du-jour.mjs
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          GEMINI_CLE_PRIVEE: ${{ secrets.GEMINI_CLE_PRIVEE }}
      - if: steps.ecrire.outputs.nouveau == 'oui'
        run: |
          git config user.name "dilmseo"
          git config user.email "dilmseo@users.noreply.github.com"
          git add contenu/blog
          git commit -m "Blog du jour : ${{ steps.ecrire.outputs.slug }}"
          git push
      - if: steps.ecrire.outputs.nouveau == 'oui'
        run: npx --yes netlify-cli@17 deploy --build --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
